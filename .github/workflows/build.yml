name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip -o futurepulse-ai.zip -d extracted_app
          if [ -f "extracted_app/package.json" ]; then
            cp -rn extracted_app/* .
          else
            SUBDIR=$(find extracted_app -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            cp -rn "$SUBDIR"/* .
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          WEB_DIR="dist"
          if [ ! -d "dist" ] && [ -d "build" ]; then
            WEB_DIR="build"
          fi
          rm -f capacitor.config.ts capacitor.config.json
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.futurepulse.ai",
            "appName": "FuturePulse AI",
            "webDir": "$WEB_DIR"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FuturePulse-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
